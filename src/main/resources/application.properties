spring.application.name=jpa

# DB connection configuration
spring.datasource.url=jdbc:mysql://osakadb02.startrust.io:3306/jpa_test?useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
spring.datasource.username=startrust
spring.datasource.password=startrust##

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true

# Batch Insert Configuration
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging Configuration
logging.level.org.hibernate.stat=DEBUG
logging.level.root=DEBUG