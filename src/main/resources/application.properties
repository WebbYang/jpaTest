spring.application.name=jpa

# DB connection configuration
spring.datasource.url=jdbc:mysql://osakadb02.startrust.io:3306/jpa_test?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=startrust
spring.datasource.password=startrust##

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true
#logging.level.org.hibernate.stat=DEBUG
#logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=INFO


# Activate Batch Insert
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true